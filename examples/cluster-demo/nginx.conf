events {
    worker_connections 1024;
}

http {
    upstream primusdb_cluster {
        least_conn;
        server coordinator:8081 max_fails=3 fail_timeout=10s;
        server worker1:8082 max_fails=3 fail_timeout=10s;
        server worker2:8083 max_fails=3 fail_timeout=10s;
    }

    upstream primusdb_federation {
        least_conn;
        server coordinator:8081;
        server fed-peer:8084;
    }

    server {
        listen 8080;

        location /health {
            proxy_pass http://coordinator:8081/health;
        }

        location /status {
            proxy_pass http://coordinator:8081/status;
        }

        location /metrics {
            proxy_pass http://coordinator:8081/metrics;
        }

        location /api/v1/crud/ {
            proxy_pass http://primusdb_cluster;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /api/v1/uql {
            proxy_pass http://primusdb_cluster;
            proxy_set_header Host $host;
        }

        location /api/v1/query {
            proxy_pass http://primusdb_cluster;
            proxy_set_header Host $host;
        }

        location /api/v1/transaction/ {
            proxy_pass http://primusdb_cluster;
            proxy_set_header Host $host;
        }

        location /api/v1/cluster/ {
            proxy_pass http://coordinator:8081;
            proxy_set_header Host $host;
        }

        location /api/v1/federation/ {
            proxy_pass http://primusdb_federation;
            proxy_set_header Host $host;
        }

        location /api/v1/kv/ {
            proxy_pass http://primusdb_cluster;
            proxy_set_header Host $host;
        }

        location /api/v1/namespace/ {
            proxy_pass http://coordinator:8081;
            proxy_set_header Host $host;
        }

        location /api/v1/advanced/ {
            proxy_pass http://primusdb_cluster;
            proxy_set_header Host $host;
        }

        location /api/v1/ddl/ {
            proxy_pass http://coordinator:8081;
            proxy_set_header Host $host;
        }

        location /api/v1/info/ {
            proxy_pass http://coordinator:8081;
            proxy_set_header Host $host;
        }

        location /api/v1/auth/ {
            proxy_pass http://coordinator:8081;
            proxy_set_header Host $host;
        }
    }
}
