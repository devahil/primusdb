version: "3.8"
services:
  primusdb-node1:
    build:
      context: ../../..
      dockerfile: Dockerfile
    hostname: node1
    ports:
      - "8081:8080"
    volumes:
      - node1_data:/var/lib/primusdb
    environment:
      - RUST_LOG=info
      - PRIMUSDB_NODE_ID=node1
      - PRIMUSDB_CLUSTER_ENABLED=true
  primusdb-node2:
    build:
      context: ../../..
      dockerfile: Dockerfile
    hostname: node2
    ports:
      - "8082:8080"
    volumes:
      - node2_data:/var/lib/primusdb
    environment:
      - RUST_LOG=info
      - PRIMUSDB_NODE_ID=node2
      - PRIMUSDB_CLUSTER_ENABLED=true
  primusdb-node3:
    build:
      context: ../../..
      dockerfile: Dockerfile
    hostname: node3
    ports:
      - "8083:8080"
    volumes:
      - node3_data:/var/lib/primusdb
    environment:
      - RUST_LOG=info
      - PRIMUSDB_NODE_ID=node3
      - PRIMUSDB_CLUSTER_ENABLED=true
volumes:
  node1_data:
  node2_data:
  node3_data:
