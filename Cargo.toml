[package]
name = "primusdb"
version = "1.3.2-alpha"
edition = "2021"
authors = ["Devahil Leivzieük <devahil@gmail.com>", "PrimusDB Team"]
description = "A hybrid database engine combining columnar, vector, document, and relational storage with encryption"
license = "GPL-3.0"
repository = "https://github.com/devahil/primusdb.git"

[workspace]
members = [
    "crates/primusdb-core",
    "crates/primusdb-storage",
    "crates/primusdb-crypto",
    "crates/primusdb-consensus",
    "crates/primusdb-transaction",
    "crates/primusdb-ai",
    "crates/primusdb-cluster",
    "crates/primusdb-drivers",
    "crates/primusdb-api",
    "crates/primusdb-error",
    "drivers/rust",
]

[dependencies]
# Core dependencies
tokio = { version = "1.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3"
chrono = { version = "0.4", features = ["serde"] }
async-trait = "0.1"

# Async and networking
axum = { version = "0.7", features = ["ws"] }
axum-server = { version = "0.8", features = ["tls-rustls"] }
futures = "0.3"
async-stream = "0.3"
tower-http = { version = "0.5", features = ["cors", "compression-gzip", "compression-deflate", "trace"] }

# Crypto and security
aes-gcm = "0.10"
argon2 = "0.5"
sha1 = "0.10"
sha2 = "0.10"
sha3 = "0.10"
blake3 = "1.5"
hmac = "0.12"

# Database and storage
sled = "0.34"

# Compression
lz4 = "1.24"
crc32fast = "1.3"
regex = "1.0"

# Logging and tracing
tracing = "0.1"
tracing-subscriber = "0.3"

# Error handling
thiserror = "1.0"

# CLI
clap = { version = "4.4", features = ["derive"] }
clap_complete = "4.4"

# Interactive REPL shell
rustyline = "15"
shlex = "1"

# HTTP client for client mode
reqwest = { version = "0.11", features = ["json", "blocking", "rustls-tls"] }

# Metrics and monitoring
prometheus = { version = "0.13", features = ["process"] }
lazy_static = "1.4"
num_cpus = "1.0"

# Cache dependencies
lru = "0.12"
bloom = "0.3"
siphasher = "1.0"

# Blockchain/Consensus
hex = "0.4"

# UUID generation for namespace IDs
uuid = { version = "1.0", features = ["v4", "serde"] }

# Base64 encoding
base64 = "0.21"

# SQL parser (replaces ad-hoc parser)
sqlparser = "0.51"

# TOML parsing for config validation
toml = "0.8"

# Database drivers (optional, for migration sources)
mysql = { version = "28", optional = true }
tokio-postgres = { version = "0.7", optional = true, features = ["with-serde_json-1"] }
mongodb = { version = "3", optional = true }

# Secure Protocol
ring = "0.17"
rcgen = { version = "0.14", features = ["pem", "x509-parser"] }
time = { version = "0.3", features = ["std"] }
rand = "0.10.1"

# AI/ML dependencies (lightweight)
# candle-core = "0.3"
# candle-nn = "0.3"

[features]
default = []
mysql-source = ["dep:mysql"]
postgres-source = ["dep:tokio-postgres"]
mongo-source = ["dep:mongodb"]

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
tempfile = "3.8"
reqwest = { version = "0.11", features = ["json", "blocking"] }
serde_json = "1.0"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true

[[bench]]
name = "storage_read"
harness = false

[[bench]]
name = "vector_search"
harness = false

[[bench]]
name = "ai_ml"
harness = false

[[bench]]
name = "relational"
harness = false

[[bench]]
name = "columnar"
harness = false

[[bench]]
name = "cache"
harness = false

[[bench]]
name = "storage_comprehensive"
harness = false
